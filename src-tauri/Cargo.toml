[package]
name = "my-timeline"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "my_timeline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features = false also drops `system-proxy`, which is what makes
# reqwest read the OS proxy config (Windows registry / macOS SCDynamicStore)
# on top of the *_PROXY env vars — keep it enabled so the app follows the
# system proxy instead of always connecting direct.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "gzip", "system-proxy"] }
feed-rs = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
ammonia = "4"
url = "2"
scraper = "0.20"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2"
# OPML import/export: the frontend reads and writes the picked file, so the
# same commands work with a desktop path and an Android document reference.
tauri-plugin-fs = "2"
roxmltree = "0.21.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# A local stub server for the sync tests. `rustls` is only needed on the server
# side of a self-signed handshake test; both crates are already in the tree.
[dev-dependencies]
# default-features off: the crate's default pulls in aws-lc-rs, which would
# leave two crypto providers compiled and make the choice ambiguous at runtime.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
